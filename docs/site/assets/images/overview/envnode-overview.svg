<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 800" role="img" aria-labelledby="title desc">
<!-- SPDX-License-Identifier: LicenseRef-EnvNode-Use-and-Redistribution-1.0; see root LICENSE. -->
<title id="title">EnvNode: vom Sensor zur Anwendung</title>
<desc id="desc">Im EnvNode-Gerät ist ein Sensor mit dem Mainboard verbunden. Die Firmware läuft auf dessen ESP32. Messwerte lassen sich im Browser lokal prüfen oder über einen externen MQTT-Broker an Anwendungen wie Home Assistant weitergeben.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9E6C00"/></marker></defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#262626;font-size:19px}
 .heading{font-size:23px;font-weight:bold;fill:#9E6C00}.label{font-size:18px;fill:#595959}.card{fill:#FFFFFF;stroke:#D6D6D6;stroke-width:2}
 .arrow{fill:none;stroke:#9E6C00;stroke-width:3;marker-end:url(#arrow)}
</style>
<rect x="1" y="1" width="838" height="798" rx="12" fill="#FFFFFF"/>
<rect x="25" y="20" width="790" height="419" rx="16" fill="#FAF4E6" stroke="#CC9319" stroke-width="2"/>
<text x="50" y="57" class="heading">Dein EnvNode-Gerät</text>
<rect class="card" x="90" y="80" width="660" height="77" rx="10"/>
<text x="420" y="111" text-anchor="middle" class="heading">Sensor</text>
<text x="420" y="139" text-anchor="middle">Zum Beispiel BME280: Temperatur, Feuchte, Luftdruck</text>
<path class="arrow" d="M420 158V196"/>
<rect class="card" x="90" y="200" width="660" height="77" rx="10"/>
<text x="420" y="231" text-anchor="middle" class="heading">Mainboard mit ESP32</text>
<text x="420" y="259" text-anchor="middle">Versorgung und Anschlüsse verbinden die Bausteine</text>
<path class="arrow" d="M420 278V316"/>
<rect class="card" x="90" y="320" width="660" height="91" rx="10"/>
<text x="420" y="352" text-anchor="middle" class="heading">Firmware auf dem ESP32</text>
<text x="420" y="382" text-anchor="middle">Liest Sensoren aus und stellt Messwerte bereit</text>
<path class="arrow" d="M420 412V476H220V501"/>
<path class="arrow" d="M420 476H620V501"/>
<text x="220" y="463" text-anchor="middle" class="label">Lokal prüfen</text>
<text x="620" y="463" text-anchor="middle" class="label">Optional weitergeben</text>
<rect class="card" x="45" y="510" width="350" height="101" rx="10"/>
<text x="220" y="545" text-anchor="middle" class="heading">Dein Browser</text>
<text x="220" y="575" text-anchor="middle" font-size="17">EnvNode-Weboberfläche über WLAN</text>
<text x="220" y="600" text-anchor="middle" class="label">Einrichten und Messwerte sehen</text>
<rect class="card" x="445" y="510" width="350" height="101" rx="10"/>
<text x="620" y="545" text-anchor="middle" class="heading">MQTT-Broker</text>
<text x="620" y="575" text-anchor="middle">Außerhalb von EnvNode</text>
<text x="620" y="600" text-anchor="middle" class="label">Verteilt die Nachrichten</text>
<path class="arrow" d="M620 612V650"/>
<rect class="card" x="445" y="660" width="350" height="101" rx="10"/>
<text x="620" y="694" text-anchor="middle" class="heading">Externe Anwendung</text>
<text x="620" y="724" text-anchor="middle">Zum Beispiel Home Assistant</text>
<text x="620" y="750" text-anchor="middle" class="label">Anzeigen, speichern, auswerten</text>
<text x="65" y="687" class="label">Dein erstes Ziel:</text>
<text x="65" y="720">Ein echter, aktueller Messwert</text>
<text x="65" y="749">direkt in der Weboberfläche.</text>
</svg>

# EnvNode-owned: see repository LICENSE.
# Add-on for the existing RemoteUDP ruleset. No listener is created here.
# rsyslog 8.2302: cookie="" parses plain JSON; newer find-json is not required.
module(load="mmjsonparse")
template(name="EnvNodeJsonLine" type="string" string="%msg%\n")
template(name="EnvNodeSystemFile" type="string" string="/var/log/envnode/%$!device_id%/system.jsonl")
template(name="EnvNodeDiagnosticFile" type="string" string="/var/log/envnode/%$!device_id%/diagnostics.jsonl")
template(name="EnvNodeSourceFile" type="string" string="/var/log/envnode/%$!device_id%/by-source/%$!source_kind%-%$!source_id%.jsonl")
template(name="EnvNodeRainFile" type="string" string="/var/log/envnode/%$!device_id%/rain-detector.jsonl")
template(name="EnvNodeControllerFile" type="string" string="/var/log/envnode/%$!device_id%/controllers.jsonl")
template(name="EnvNodeMarkerFile" type="string" string="/var/log/envnode/%$!device_id%/test-markers.jsonl")

ruleset(name="EnvNodeUnrouted") {
    action(type="omfile" file="/var/log/envnode/unrouted.log" template="RSYSLOG_FileFormat"
           fileOwner="root" fileGroup="adm" fileCreateMode="0640"
           dirOwner="root" dirGroup="adm" dirCreateMode="0750")
}
ruleset(name="EnvNodeJsonSplit") {
    if ($app-name == "envnode-system" or $app-name == "envnode-diagnostic") then {
        action(type="mmjsonparse" cookie="")
        if ($parsesuccess != "OK" or not re_match($!device_id, '^[0-9a-f]{12}$')) then {
            call EnvNodeUnrouted
            stop
        }
        if ($app-name == "envnode-system" and $!type == "system") then {
            action(type="omfile" dynaFile="EnvNodeSystemFile" template="EnvNodeJsonLine"
                   fileOwner="root" fileGroup="adm" fileCreateMode="0640"
                   dirOwner="root" dirGroup="adm" dirCreateMode="0750")
            stop
        }
        if ($app-name != "envnode-diagnostic" or $!type != "diagnostic") then {
            call EnvNodeUnrouted
            stop
        }
        # The complete diagnostic stream is the basis for sequence-gap checks.
        action(type="omfile" dynaFile="EnvNodeDiagnosticFile" template="EnvNodeJsonLine"
               fileOwner="root" fileGroup="adm" fileCreateMode="0640"
               dirOwner="root" dirGroup="adm" dirCreateMode="0750")
        # Restrict every field used in a pathname. Unknown source metadata stays
        # in diagnostics.jsonl and is also visible in unrouted.log.
        set $.source_ok = 0;
        if re_match($!source_id, '^(0|[1-9][0-9]?)$') then {
            if ($!source_kind == "system" and $!source_id == 0) then {
                set $.source_ok = 1;
            }
            if (($!source_kind == "sensor" or $!source_kind == "actuator" or
                 $!source_kind == "controller" or $!source_kind == "module") and
                $!source_id >= 1 and $!source_id <= 32) then {
                set $.source_ok = 1;
            }
        }
        if $.source_ok != 1 then {
            call EnvNodeUnrouted
            stop
        }
        action(type="omfile" dynaFile="EnvNodeSourceFile" template="EnvNodeJsonLine"
               fileOwner="root" fileGroup="adm" fileCreateMode="0640"
               dirOwner="root" dirGroup="adm" dirCreateMode="0750")
        if $!event startswith "rain_" then {
            action(type="omfile" dynaFile="EnvNodeRainFile" template="EnvNodeJsonLine"
                   fileOwner="root" fileGroup="adm" fileCreateMode="0640"
                   dirOwner="root" dirGroup="adm" dirCreateMode="0750")
        }
        if $!source_kind == "controller" then {
            action(type="omfile" dynaFile="EnvNodeControllerFile" template="EnvNodeJsonLine"
                   fileOwner="root" fileGroup="adm" fileCreateMode="0640"
                   dirOwner="root" dirGroup="adm" dirCreateMode="0750")
        }
        if $!event == "test_marker" then {
            action(type="omfile" dynaFile="EnvNodeMarkerFile" template="EnvNodeJsonLine"
                   fileOwner="root" fileGroup="adm" fileCreateMode="0640"
                   dirOwner="root" dirGroup="adm" dirCreateMode="0750")
        }
        stop
    }
}

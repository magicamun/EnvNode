# EnvNode-owned: see repository LICENSE.
# Standalone example; adapt paths, bind address and ownership before installation.
# For an /etc/rsyslog.d snippet, load imudp only once in the full configuration.
global(maxMessageSize="4k")
module(load="imudp")
template(name="EnvNodeJsonLine" type="string" string="%msg%\n")
ruleset(name="EnvNodeUdp") {
    if $app-name == "envnode-system" then {
        action(type="omfile" file="/var/log/envnode/system.jsonl"
               template="EnvNodeJsonLine" fileCreateMode="0640" dirCreateMode="0750")
        stop
    }
    if $app-name == "envnode-diagnostic" then {
        action(type="omfile" file="/var/log/envnode/diagnostics.jsonl"
               template="EnvNodeJsonLine" fileCreateMode="0640" dirCreateMode="0750")
        stop
    }
    action(type="omfile" file="/var/log/envnode/unrecognized.log")
    stop
}
input(type="imudp" address="192.168.20.10" port="514" ruleset="EnvNodeUdp")

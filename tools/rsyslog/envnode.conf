# STANDALONE EXAMPLE ONLY. Do not add this listener alongside 20-remote-udp.conf.
# Install 10-envnode-json.conf first, or adapt the include below.
global(maxMessageSize="4k")
module(load="imudp")
include(file="/etc/rsyslog.d/10-envnode-json.conf")
ruleset(name="EnvNodeUdp") {
    call EnvNodeJsonSplit
    stop
}
input(type="imudp" address="192.168.20.10" port="514" ruleset="EnvNodeUdp")

; ============================================================
; EnvNode
; ESP32 Weather Sensor Node
; ============================================================

[platformio]
default_envs = esp32dev
extra_configs = platformio.local.ini

[env]
board_build.partitions = partitions.csv

[esp32_common]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/generate_build_info.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200

[env:esp32dev]
extends = esp32_common
build_src_filter = +<*> -<testboard/>
lib_deps =
    olikraus/U8g2 @ 2.36.12
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit BME280 Library @ ^2.3.0
    adafruit/Adafruit SHT4x Library @ ^1.0.5
    adafruit/Adafruit SHTC3 Library @ ^1.0.1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DU8X8_WITH_USER_PTR
    -DENVNODE_BOARD_MAINBOARD

; Separate application: only its own composition and shared local libraries.
[env:testboard]
extends = esp32_common
build_src_filter = -<*> +<testboard/>
custom_firmware_version_header = src/testboard/TestBoardFirmwareVersion.h
build_flags = -DCORE_DEBUG_LEVEL=3

[env:native]
test_ignore = test_testboard_*
platform = native
test_build_src = yes
build_flags =
    -std=c++11
    -I test/support
    -DENVNODE_BOARD_MAINBOARD
build_src_filter =
    +<I2CBusManager.cpp>
    +<BoardIdentityResolver.cpp>
    +<BoardProfile.cpp>
    +<HardwareDescriptorCompatibility.cpp>
    +<ModuleDescriptorProvisioningService.cpp>
    +<ModuleDiscoveryService.cpp>
    +<ModuleDeviceInventory.cpp>
    +<HardwareResources.cpp>
    +<ActuatorImplementationRegistry.cpp>
    +<GpioOnOffActuator.cpp>
    +<GpioPwmActuator.cpp>
    +<ActuatorFactory.cpp>
    +<ActuatorRuntime.cpp>
    +<ActuatorMqttAdapter.cpp>
    +<ActuatorStatePublisher.cpp>
    +<MqttTopic.cpp>
    +<ControllerImplementationRegistry.cpp>
    +<BlinkController.cpp>
    +<ControllerFactory.cpp>
    +<ControllerRuntime.cpp>
    +<ControllerMqttAdapter.cpp>
    +<ControllerStatePublisher.cpp>
    +<MqttMessageRouter.cpp>
    +<RuntimeManager.cpp>
    +<ConfigurationService.cpp>
    +<ConfigurationBackup.cpp>
    +<Measurement.cpp>
    +<MeasurementPublisher.cpp>
    +<GeoPosition.cpp>
    +<GeoPositionWebView.cpp>
    +<LocalizedDecimal.cpp>
    +<PressureReduction.cpp>
    +<PressureReductionWebView.cpp>
    +<SeaLevelPressureSensor.cpp>
    +<MeasurementQuality.cpp>
    +<MeasurementSnapshotCache.cpp>
    +<SensorPropertyReader.cpp>
    +<ActuatorPropertyReader.cpp>
    +<ControllerPropertyReader.cpp>
    +<PropertyResolver.cpp>
    +<EnumValue.cpp>
    +<ValueConfiguration.cpp>
    +<ValueRuntime.cpp>
    +<ValueMqttTopic.cpp>
    +<ValueMqttAdapter.cpp>
    +<ValueStatePublisher.cpp>
    +<ValuePropertyReader.cpp>
    +<ValueWebView.cpp>
    +<TimePropertyReader.cpp>
    +<PropertyTextFormatter.cpp>
    +<PropertySourceInput.cpp>
    +<DisplayConfiguration.cpp>
    +<DisplayPageFormatter.cpp>
    +<DisplayService.cpp>
    +<PropertyPreviewWebView.cpp>
    +<PropertyWebView.cpp>
    +<ThresholdController.cpp>
    +<SelectorController.cpp>
    +<SelectorWebView.cpp>
    +<ControllerWebSupport.cpp>
    +<SensorImplementationRegistry.cpp>
    +<ConfigurationRuntimeEffect.cpp>
    +<SystemLogTimeProvider.cpp>
    +<WebNavigation.cpp>
    +<WebPresentationText.cpp>
    +<ElapsedTimeFormatter.cpp>
    +<ControllerParameterMetadata.cpp>
    +<ExternalMetadata.cpp>
    +<ExternalDescriptionBuilder.cpp>
    +<MqttDescriptionPublisher.cpp>
    +<UnitConverter.cpp>
    +<SensorManager.cpp>
    +<HomeAssistantDiscoveryPublisher.cpp>
    +<LinearTwoPointCalibration.cpp>
    +<AverageAnalogSampler.cpp>
    +<AnalogPressureSensor.cpp>

[env:esp32dev_serial_diagnostics]
extends = env:esp32dev
upload_speed = 115200
build_flags =
    ${env:esp32dev.build_flags}
    -DENVNODE_SERIAL_WRITE_DIAGNOSTICS=1

; Exercise the tester composition without linking the EnvNode application.
[env:testboard_native]
platform = native
test_build_src = yes
test_filter = test_testboard_*
build_flags =
    -std=c++11
    -I test/support
    -I src/testboard
build_src_filter =
    -<*>
    +<testboard/TestBoardSettings.cpp>
    +<testboard/TestBoardWeb.cpp>
    +<testboard/testing/>
    +<testboard/provisioning/>

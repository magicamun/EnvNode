; ============================================================
; WeatherStation
; ESP32 Weather Sensor Node
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    knolleary/PubSubClient @ ^2.8

; ------------------------------------------------------------
; Serial Monitor
; ------------------------------------------------------------

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0
; ------------------------------------------------------------
; Build
; ------------------------------------------------------------

build_flags =
    -DCORE_DEBUG_LEVEL=3

; ------------------------------------------------------------
; Upload
; ------------------------------------------------------------
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
upload_speed = 115200

; EnvNode: see ../../LICENSE.
[platformio]
default_envs = arduino3

[env]
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0

[env:arduino3]
platform = espressif32 @ 8.0.0

[env:arduino2]
platform = espressif32 @ 7.0.1

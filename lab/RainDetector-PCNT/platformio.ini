[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_eol = LF
monitor_filters =
    send_on_enter
    direct
    log2file
upload_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

; Shared, hardware-independent evaluation core; normal firmware integration follows later.
lib_extra_dirs = ../../firmware/lib

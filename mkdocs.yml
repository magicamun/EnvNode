site_name: EnvNode Dokumentation
site_url: https://docs.envnode.de/
site_description: Modulare Hardware und Firmware für zuverlässige Umweltmessungen
repo_url: https://github.com/magicamun/EnvNode
repo_name: magicamun/EnvNode
docs_dir: docs/site
site_dir: site
strict: true
copyright: '© 2026 Lutz Thielemann · <a href="https://github.com/magicamun/EnvNode/blob/main/LICENSE">Lizenz und Nutzung</a>'
theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    scheme: default
plugins:
  - search:
      lang: de
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - tables
extra_css:
  - assets/stylesheets/envnode.css?v=20261028-board-views
hooks:
  - tools/docs_assets.py
nav:
  - Start: index.md
  - Dein erstes EnvNode: getting-started/index.md
  - Grundlagen:
      - Gesamtübersicht: concepts/index.md
  - Hardware:
      - Übersicht: hardware/index.md
      - Mainboards:
          - Übersicht: mainboards/index.md
          - Mini: mainboards/mini/index.md
          - Weather: mainboards/weatherstation/index.md
          - ORing Power: mainboards/oring-power/index.md
      - Module:
          - Übersicht: modules/index.md
          - DuoRelay: modules/duo-relay/index.md
          - AnalogHydroPressure: modules/analog-hydro-pressure/index.md
          - SD-Card: modules/sd-card/index.md
          - I²C Carrier HalfSize: modules/i2c-carrier/assembly.md
      - Sensoren:
          - Übersicht: sensors/index.md
          - I²C-Sensoren: sensors/i2c.md
          - SCT013:
              - Übersicht: sensors/sct013/index.md
              - Head: sensors/sct013-head/assembly.md
          - RainDetector:
              - Übersicht: sensors/rain-detector/index.md
              - Controller: sensors/rain-detector-controller/assembly.md
              - Head: sensors/rain-detector-head/assembly.md
      - Displays: displays/index.md
      - HW-Schnittstellen:
          - Übersicht & Pinouts: interfaces/index.md
          - Modulschnittstelle im Detail: concepts/module-interface.md
      - Kompatibilität: compatibility.md
      - Testhardware:
          - Übersicht: hardware/testhardware/index.md
          - Test-Controller: mainboards/test-controller/index.md
          - Input-Adapter: mainboards/input-adapter/index.md
          - Modul-Adapter: mainboards/module-adapter/index.md
  - Firmware:
      - Bedienungsanleitung: firmware/index.md
      - Begriffe und Oberfläche: firmware/basics.md
      - Bauen und Aufspielen: firmware/installation.md
      - Erste Inbetriebnahme: firmware/configuration.md
      - GeoPosition und Meereshöhendruck: firmware/geo-position-pressure.md
      - Hardware und Provisioning: firmware/provisioning.md
      - Sensoren und Messwerte: firmware/sensors.md
      - Ausgänge schalten: firmware/actuators.md
      - Lokale Controller: firmware/controllers.md
      - Values und Anzeigen: firmware/values-displays.md
      - MQTT und Home Assistant: firmware/mqtt.md
      - Wartung und Diagnose: firmware/maintenance.md
      - Beispiele:
          - Mini mit SHT4x: firmware/example-measurement.md
          - DuoRelay mit Blink: firmware/example-relay.md
  - Aufbauanleitungen:
      - Übersicht: guides/index.md
      - Dokumentationsstand: guides/status.md
      - Bestückungspläne: guides/board-views.md
      - Alte Revisionen: guides/old-revisions.md
  - Bausätze und Aufbau: kits/index.md
  - Lizenz und Nutzung: license.md

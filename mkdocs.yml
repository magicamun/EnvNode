site_name: EnvNode Dokumentation
site_url: https://docs.envnode.de/
site_description: Modulare Hardware und Firmware für zuverlässige Umweltmessungen
repo_url: https://github.com/magicamun/EnvNode
repo_name: magicamun/EnvNode
docs_dir: docs/site
site_dir: site
strict: true
copyright: '© 2026 Lutz Thielemann · <a href="https://github.com/magicamun/EnvNode/blob/main/LICENSE">Lizenz und Nutzung</a>'
theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    scheme: default
plugins:
  - search:
      lang: de
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - tables
extra_css:
  - assets/stylesheets/envnode.css
hooks:
  - tools/docs_assets.py
nav:
  - Start: index.md
  - Grundlagen: concepts/index.md
  - Mainboards:
      - Übersicht: mainboards/index.md
      - EnvNode Mini: mainboards/mini/index.md
      - Weatherstation: mainboards/weatherstation/index.md
      - ORing Power: mainboards/oring-power/index.md
  - Module:
      - Übersicht: modules/index.md
      - DuoRelay: modules/duo-relay/index.md
      - AnalogHydroPressure: modules/analog-hydro-pressure/index.md
  - Sensoren:
      - Übersicht: sensors/index.md
      - I²C-Sensoren: sensors/i2c.md
      - RainDetectorController und Head: sensors/rain-detector.md
      - SCT013: sensors/sct013.md
  - Displays: displays/index.md
  - Firmware:
      - Übersicht: firmware/index.md
      - Bauen und Aufspielen: firmware/installation.md
      - Einrichtung: firmware/configuration.md
      - MQTT: firmware/mqtt.md
      - Updates und Diagnose: firmware/maintenance.md
  - Bausätze und Aufbau: kits/index.md
  - Lizenz und Nutzung: license.md
